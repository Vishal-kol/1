name: Azure ML CI/CD

on:
  push:
    branches:
      - main

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
         activate-environment: xgb-env
         environment-file: predictive-maintenance/env.yaml
         python-version: 3.9

    - name: Setup Conda environment
      run: |
        conda env create -f predictive-maintenance/env.yaml
        conda activate xgb-env   # use the name defined in env.yaml


 
    - name: Train model
      run: |
        python src/train.py data/engine_data.csv

    - name: Deploy model
      run: |
        python deploy.py
