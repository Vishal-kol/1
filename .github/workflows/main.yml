name: Train and Deploy Model

on:
  push:
    branches:
      - main

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        activate-environment: xgb-env
        environment-file: predictive-maintenance/env.yaml
        python-version: 3.9

    - name: Verify Miniconda
      run: |
        conda list | grep xgboost

    - name: Train model
      run: |
        python predictive-maintenance/src/train.py predictive-maintenance/data/engine_data.csv

    - name: Deploy model
      run: |
        python predictive-maintenance/src/deploy.py
