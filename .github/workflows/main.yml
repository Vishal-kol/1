name: Azure ML CI/CD

on:
  push:
    branches:
      - main

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install azureml-core azureml-defaults
        pip install -r requirements.txt

    - name: Train model
      run: |
        python src/train.py data/engine_data.csv

    - name: Deploy model
      run: |
        python deploy.py
